[project]
name = "eilaf-volunteer-chatbot"
version = "0.1.0"
description = "RAG-based volunteer chatbot for Eilaf (Hebrew now, Arabic later), with scraping, embedding, and speech-to-text units."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # data scraping / documents
    "beautifulsoup4",   # bs4
    "requests",
    "python-docx",      # docx
    "pymupdf",          # fitz
    # rag
    "numpy",
    "sentence-transformers",
    # apps
    "streamlit",
    # speech-to-text
    "faster-whisper",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
# Explicit top-level units. ``find`` only picks up packages that actually
# exist on the current branch, so units that merge in later (e.g. transcription)
# are auto-included without breaking the build when absent.
include = ["app*", "chatbot*", "data*", "transcription*"]
