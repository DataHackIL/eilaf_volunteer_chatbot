[project]
name = "eilaf-volunteer-chatbot"
version = "0.1.0"
description = "RAG-based volunteer chatbot for Eilaf (Hebrew now, Arabic later), with scraping, embedding, and speech-to-text units."
readme = "README.md"
requires-python = ">=3.11"
# Everything here is installed in the WhatsApp container (app/whatsapp/Dockerfile
# runs a plain `uv sync --no-dev`, i.e. no extras). Anything a *front-end* or a
# side unit needs — and the server does not — belongs in the extras below, where
# it stays out of the image. See the note there before adding a heavy dependency.
dependencies = [
    # data scraping / documents. python-docx and pymupdf are NOT curation-only:
    # chatbot/rag/documents/documents.py imports them at module level, so the
    # retrieval core needs them even when nothing is being scraped.
    "beautifulsoup4",   # bs4
    "requests",
    "python-docx",      # docx
    "pymupdf",          # fitz
    # rag
    "numpy",
    "sentence-transformers",
    # enrichment / LLM. Both halves ship: data/enrich/* drives the boot-time
    # curation pass, chatbot/rag/generator/* is the live answer head. pydantic
    # for the structured-output schema; dotenv loads the keys from a local .env.
    "anthropic",
    # OpenAI-compatible chat endpoints (Cerebras / Groq / OpenRouter free tiers).
    "openai",
    "google-genai>=2.12.1",
    "pydantic",
    "python-dotenv",
    # whatsapp front-end (webhook server + outbound Cloud API calls)
    "fastapi",
    "uvicorn[standard]",
    "httpx",
]

# Opt-in units. The WhatsApp webhook server imports neither, and together they
# pull 616 MB of wheels into an image that would never touch them — pyarrow and
# pandas behind streamlit, ctranslate2 and onnxruntime behind faster-whisper.
# (Measured: site-packages in the container went 2119 MB -> 1503 MB when these
# two moved out here.) On a dev machine take them all: `uv sync --all-extras`.
[project.optional-dependencies]
# The Streamlit front-ends: app/visualizer (the RAG explorer) and app/stt_eval.
apps = ["streamlit"]
# The transcription/ unit, which merges in on its own branch (see the packages
# note below — `find` tolerates it being absent).
stt = ["faster-whisper"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
# Explicit top-level units. ``find`` only picks up packages that actually
# exist on the current branch, so units that merge in later (e.g. transcription)
# are auto-included without breaking the build when absent.
include = ["app*", "chatbot*", "data*", "transcription*"]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort (import ordering)
    "W",   # pycodestyle warnings
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
]
# Line length is enforced by the formatter; E501 only adds noise for strings
# and docstrings the formatter deliberately leaves alone.
ignore = ["E501"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
